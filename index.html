<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Faculty and Post-doc Applications</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--fg:#1c1b19;--muted:#6b6862;--line:#e3e0d9;--accent:#2f5d8a;--accent-soft:#e6eef6;
  --ok:#2e6b3f;--ok-soft:#e3f1e6;--warn:#8a5a12;--warn-soft:#f8eedb;--dim:#7a7770;--dim-soft:#efede8;--bad:#a23a2a;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--surface:#1f1f1d;--fg:#ecebe7;--muted:#a19e97;--line:#33322f;--accent:#8db6df;--accent-soft:#1f2c3a;
  --ok:#8fcf9d;--ok-soft:#1e2e22;--warn:#e5bb6c;--warn-soft:#352a17;--dim:#a19e97;--dim-soft:#2a2927;--bad:#f09a8b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:32px 0 10px;font-weight:600}
.sub{color:var(--muted);margin:0}
a{color:var(--accent)}
.lock{max-width:360px;margin:18vh auto 0;display:grid;gap:12px}
.lock input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);min-height:1.5em;margin:0;font-size:14px}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.summary span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px}
.summary b{font-variant-numeric:tabular-nums}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 210px;gap:4px 18px;align-items:center;padding:9px 14px}
.row+.row{border-top:1px solid var(--line)}
.inst{font-weight:650;font-size:15px;line-height:1.35}
.job{font-size:13.5px;line-height:1.4;color:var(--muted)}
.job a{white-space:nowrap;margin-left:6px}
.dates{display:grid;gap:1px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.dates .due{font-weight:600}
.dates .sent{font-weight:600}
.dates .due:has(~.sent){font-weight:400;color:var(--muted)}
.letters{font-size:13px;font-weight:600;line-height:1.3;padding:5px 10px;border-radius:6px;border:1px solid transparent}
.letters.application{background:var(--warn);color:var(--surface)}
.letters.optional{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.letters.request{background:var(--accent-soft);color:var(--accent)}
.letters.unknown{background:var(--dim-soft);color:var(--dim);font-weight:500}
.example{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.example .links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:14px}
.callout{margin-top:20px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:8px;padding:12px 14px}
.callout strong{color:var(--warn)}
.callout ul{margin:6px 0 0;padding-left:18px}
.callout .state{display:inline-block;margin-left:8px;padding:0 7px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.callout .state.sent{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.callout p{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:6px}.dates{text-align:left}.letters{justify-self:start}}
</style>
</head>
<body>
<main id="app">
  <form class="lock" id="lock">
    <h1>Faculty and Post-doc Applications</h1>
    <p class="sub">Enter the password to see the applications.</p>
    <label for="pw" class="sub">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="go">Open</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</main>

<script>
const vault=JSON.parse(document.getElementById("vault").textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const STAGES=[["offer","Offer"],["campus","Campus visit"],["interview","First-round interview"],["submitted","Submitted"],
  ["preparing","In progress"],["watching","Planning to apply"],["withdrawn","Withdrawn"],["rejected","Closed"]];
const LETTERS={application:"Letters due with application",optional:"Letters optional with application",request:"School will request letters"};

async function deriveKey(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:bytes(vault.salt),iterations:vault.iter},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const open_=(key,box)=>crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(box.iv)},key,bytes(box.ct));

function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs))k==="class"?e.className=v:e.setAttribute(k,v);
  for(const k of kids)if(k!=null&&k!=="")e.append(k);
  return e;
}
const fmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):"";
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";

async function render(key,meta){
  const urls={};
  await Promise.all(Object.entries(vault.files).map(async([id,box])=>{
    urls[id]=URL.createObjectURL(new Blob([await open_(key,box)],{type:"application/pdf"}))}));
  const app=document.getElementById("app");app.replaceChildren();
  const groups=STAGES.map(([s,l])=>[s,l,meta.apps.filter(a=>a.status===s).sort((x,y)=>(x.deadline||"9999").localeCompare(y.deadline||"9999"))]).filter(g=>g[2].length);
  app.append(el("h1",{},"Faculty and Post-doc Applications"),
    el("p",{class:"sub"},`Where I’ve applied, when each is due, and what I submitted. Updated ${fmt(meta.updated)}.`),
    el("div",{class:"summary"},...groups.map(([,l,list])=>el("span",{},el("b",{},String(list.length))," ",l.toLowerCase()))));
  // Letters that have to arrive with the application, so letter writers see them first.
  const upfront=meta.apps.filter(a=>["application","optional"].includes(a.letterTiming)&&!["withdrawn","rejected"].includes(a.status))
    .sort((x,y)=>(x.deadline||"9999").localeCompare(y.deadline||"9999"));
  if(upfront.length)app.append(el("div",{class:"callout"},el("strong",{},"Letters requested at the time of application"),
    el("ul",{},...upfront.map(a=>el("li",{},el("b",{},a.institution),` · ${a.title}`,a.letterTiming==="optional"?" · optional":"",
      ["submitted","interview","campus","offer"].includes(a.status)||a.submitted
        ?el("span",{class:"state sent"},a.submitted?`Application submitted ${fmt(a.submitted)}`:"Application submitted")
        :el("span",{class:"state"},"Not submitted yet")))),
    el("p",{},"Everywhere else, the school will contact you if it needs a letter.")));
  const ex=meta.example;
  if(ex&&ex.files.length)app.append(el("div",{class:"example"},el("strong",{},"Example of submitted statements"),
    el("div",{class:"sub"},`${ex.institution} · ${ex.title}`),
    el("div",{class:"links"},...ex.files.map(f=>el("a",{href:urls[f.id],target:"_blank",rel:"noopener"},f.name.replace(/\.pdf$/i,""))))));
  for(const[,label,list]of groups){
    app.append(el("h2",{},label),el("div",{class:"list"},...list.map(a=>{
      const post=safeUrl(a.portal);
      return el("div",{class:"row"},
        el("div",{},el("div",{class:"inst"},a.institution),
          el("div",{class:"job"},a.title,post?el("a",{href:post,target:"_blank",rel:"noopener noreferrer"},"Posting ↗"):"")),
        el("div",{class:"dates"},el("span",{class:"due"},a.deadline?`Due ${fmt(a.deadline)}`:"No deadline listed"),
          a.submitted?el("span",{class:"sent"},`Application submitted ${fmt(a.submitted)}`):""),
        el("div",{class:`letters ${a.letterTiming||"unknown"}`},LETTERS[a.letterTiming]||"Letter timing not stated"));
    })));
  }
}

async function unlock(pw,remember){
  const key=await deriveKey(pw);
  const meta=JSON.parse(new TextDecoder().decode(await open_(key,vault.meta)));
  if(remember)try{sessionStorage.setItem("pw",pw)}catch(e){}
  await render(key,meta);
}

document.getElementById("lock").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=document.getElementById("go"),err=document.getElementById("err");
  go.disabled=true;go.textContent="Opening…";err.textContent="";
  try{await unlock(document.getElementById("pw").value,true)}
  catch(x){err.textContent="That password didn’t work.";go.disabled=false;go.textContent="Open"}
});
try{const saved=sessionStorage.getItem("pw");if(saved)unlock(saved,false).catch(()=>{})}catch(e){}
</script>
</body>
</html>
